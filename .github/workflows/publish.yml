name: Publish to PyPI
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pypi-publish:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: "Install uv"
        uses: astral-sh/setup-uv@v10.3.0

      - name: Build
        run: uv build

      - name: Publish to PyPi
        run: uv publish -v dist/*
