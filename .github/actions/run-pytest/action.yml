name: "Run Pytest"
description: "Run pytest with appropriate flags for the platform"

runs:
  using: "composite"
  steps:
    - name: Install Deno
      uses: denoland/setup-deno@v2.0.5
      with:
        deno-version: v2.x

    - name: Pre-cache Deno dependencies
      if: runner.os != 'Windows'
      shell: bash
      run: deno cache src/prefab_ui/sandbox/runner.js || true

    - name: Warm Pyodide package cache on Windows
      if: runner.os == 'Windows'
      shell: bash
      run: |
        # Pyodide writes downloaded wheels into a shared cache. Initialize it
        # before pytest workers can start multiple cold runtimes concurrently.
        uv run --no-sync python - <<'PY'
        import asyncio
        from prefab_ui.sandbox import Sandbox

        async def warm_cache():
            async with Sandbox() as sandbox:
                await sandbox.run(
                    'from prefab_ui.components import Text\nview = Text("ready")'
                )

        asyncio.run(warm_cache())
        PY

    - name: Run pytest
      shell: bash
      run: |
        TIMEOUT="5"
        MAX_PROCS="4"

        PARALLEL_FLAGS="--numprocesses auto --maxprocesses $MAX_PROCS --dist worksteal"

        uv run --no-sync pytest \
          --timeout=$TIMEOUT \
          $PARALLEL_FLAGS \
          tests
