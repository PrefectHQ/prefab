name: Check generated files

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check_docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: ./.github/actions/setup-uv
        with:
          resolution: locked

      - name: Install renderer dependencies
        run: cd renderer && npm ci

      - name: Build docs
        run: uv run prefab dev build-docs

      - name: Build bundled renderer
        run: uv run prefab dev build-renderers

      - name: Check for stale generated files
        run: |
          STALE_FILES=$(git diff --name-only docs/ renderer/src/playground/bundle.json renderer/src/playground/examples.json tools/preview-classes.html src/prefab_ui/renderer/app.html)
          if [ -n "$STALE_FILES" ]; then
            echo "::error::Generated files are out of date. Rebuild and commit the output."
            echo ""
            echo "Stale files:"
            echo "$STALE_FILES"
            echo ""
            echo "To fix:"
            echo "  uv run prefab dev build-docs"
            echo "  uv run prefab dev build-renderers"
            echo "  git add docs/ renderer/src/playground/bundle.json renderer/src/playground/examples.json tools/preview-classes.html src/prefab_ui/renderer/app.html"
            echo "  git commit -m 'Regenerate build artifacts'"
            exit 1
          fi
          echo "All generated files are up to date."
