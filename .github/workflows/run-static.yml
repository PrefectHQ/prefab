name: Run static analysis

env:
  PY_COLORS: 1

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/**"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/**"

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  static_analysis:
    timeout-minutes: 2
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: ./.github/actions/setup-uv
        with:
          resolution: locked

      - name: Install renderer dependencies
        run: cd renderer && npm ci

      - name: Run prek
        uses: j178/prek-action@v1
        env:
          SKIP: no-commit-to-branch

      - name: Check docs are up to date
        run: |
          uv run prefab dev build-docs
          git diff --name-only docs/
          git diff --quiet docs/ || {
            echo "::error::docs/ is out of date. Run 'prefab dev build-docs' and commit the result."
            exit 1
          }

      - name: Check for broken docs links
        run: cd docs && npx mint@latest broken-links
