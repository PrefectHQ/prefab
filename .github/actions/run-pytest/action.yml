name: "Run Pytest"
description: "Run pytest with appropriate flags for the platform"

runs:
  using: "composite"
  steps:
    - name: Install Deno
      if: runner.os != 'Windows'
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Pre-cache Deno dependencies
      if: runner.os != 'Windows'
      shell: bash
      run: deno cache src/prefab_ui/sandbox/runner.js || true

    - name: Run pytest
      shell: bash
      run: |
        TIMEOUT="5"
        MAX_PROCS="4"

        PARALLEL_FLAGS="--numprocesses auto --maxprocesses $MAX_PROCS --dist worksteal"

        uv run --no-sync pytest \
          --timeout=$TIMEOUT \
          $PARALLEL_FLAGS \
          tests
