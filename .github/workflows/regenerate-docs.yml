name: Check generated files

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check_generated:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup uv
        uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
          resolution: locked

      - name: Install renderer dependencies
        run: |
          git fetch origin "${{ github.base_ref || github.ref_name }}" --depth=1
          git show "origin/${{ github.base_ref || github.ref_name }}:renderer/package-lock.json" > /tmp/base-package-lock.json
          node .github/scripts/check-npm-package-age.mjs --lockfile renderer/package-lock.json --base-lockfile /tmp/base-package-lock.json --days 7
          cd renderer && npm ci

      - name: Build docs
        run: uv run prefab dev build-docs

      - name: Build bundled renderer
        run: uv run prefab dev build-renderers

      - name: Commit regenerated files if stale
        run: |
          STALE_FILES=$(git diff --name-only)
          if [ -n "$STALE_FILES" ]; then
            echo "Stale files detected:"
            echo "$STALE_FILES"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "Regenerate build artifacts"
            git push
          else
            echo "All generated files are up to date."
          fi
