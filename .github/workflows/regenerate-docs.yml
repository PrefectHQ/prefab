name: Check generated files

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check_generated:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup uv
        uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
          resolution: locked

      - name: Install renderer dependencies
        run: |
          git fetch origin "${{ github.base_ref || github.ref_name }}" --depth=1
          git show "origin/${{ github.base_ref || github.ref_name }}:renderer/package-lock.json" > /tmp/base-package-lock.json
          node .github/scripts/check-npm-package-age.mjs --lockfile renderer/package-lock.json --base-lockfile /tmp/base-package-lock.json --days 7
          cd renderer && npm ci

      - name: Build docs
        run: uv run prefab dev build-docs

      - name: Build bundled renderer
        run: uv run prefab dev build-renderers

      - name: Check regenerated files
        run: |
          STALE_FILES=$(git diff --name-only)
          if [ -n "$STALE_FILES" ]; then
            echo "Stale files detected:"
            echo "$STALE_FILES"
            echo "::error::Generated files are stale. Run 'prefab dev build-docs' and 'prefab dev build-renderers' locally, then commit the results."
            exit 1
          else
            echo "All generated files are up to date."
          fi
